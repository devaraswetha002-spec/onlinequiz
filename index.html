<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Quiz Portal</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:
            radial-gradient(circle at top left, rgba(0,153,255,0.35), transparent 30%),
            radial-gradient(circle at bottom right, rgba(0,102,204,0.30), transparent 30%),
            linear-gradient(135deg,#000000,#020b1f,#001f4d,#000814,#000000);
            background-size: cover;
            color:white;
            min-height:100vh;
            overflow-x:hidden;
            position:relative;
        }

        body::before{
            content:"";
            position:fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            background:url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1974&auto=format&fit=crop') center/cover;
            opacity:0.12;
            z-index:-2;
        }

        body::after{
            content:"";
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,51,102,0.5));
            z-index:-1;
        }

        .container{
            width:90%;
            max-width:1000px;
            margin:auto;
            padding:20px;
        }

        h1,h2,h3{
            text-align:center;
            margin-bottom:20px;
        }

        .card{
            background: rgba(255,255,255,0.08);
            padding:25px;
            border-radius:15px;
            margin-top:20px;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        input,select,button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
        }

        input,select{
            background:#e6f0ff;
        }

        button{
            background:#0066ff;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0047b3;
        }

        .hidden{
            display:none;
        }

        .question{
            margin-bottom:20px;
            padding:15px;
            background:rgba(0,0,0,0.3);
            border-radius:10px;
        }

        .question p{
            margin-bottom:10px;
            font-weight:bold;
        }

        .option{
            margin:8px 0;
        }

        .score-box{
            text-align:center;
            font-size:28px;
            color:#00ffcc;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .logout-btn{
            width:auto;
            padding:10px 20px;
        }

        .admin-note{
            color:#66ccff;
            text-align:center;
            margin-top:10px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Engineering Online Quiz Application</h1>

    <!-- Registration Section -->
    <div class="card" id="registerSection">
        <h2>Student Registration</h2>

        <input type="text" id="studentName" placeholder="Enter Student Name">
        <input type="email" id="studentEmail" placeholder="Enter Email">

        <select id="subjectSelect">
            <option value="">Select Subject</option>
            <option value="c">C Programming</option>
            <option value="java">Java</option>
            <option value="dbms">DBMS</option>
        </select>

        <button onclick="startQuiz()">Register & Start Quiz</button>
    </div>

    <!-- Admin Login -->
    <div class="card" id="adminLoginSection">
        <h2>Admin Login</h2>

        <input type="text" id="adminUser" placeholder="Admin Username">
        <input type="password" id="adminPass" placeholder="Admin Password">

        <button onclick="adminLogin()">Login as Admin</button>

        <p class="admin-note">Admin can add questions. Students cannot access admin panel.</p>
    </div>

    <!-- Admin Panel -->
    <div class="card hidden" id="adminPanel">

        <div class="header">
            <h2>Admin Panel</h2>
            <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
        </div>

        <select id="adminSubject">
            <option value="c">C Programming</option>
            <option value="java">Java</option>
            <option value="dbms">DBMS</option>
        </select>

        <input type="text" id="questionInput" placeholder="Enter Question">
        <input type="text" id="option1" placeholder="Option 1">
        <input type="text" id="option2" placeholder="Option 2">
        <input type="text" id="option3" placeholder="Option 3">
        <input type="text" id="option4" placeholder="Option 4">
        <input type="text" id="correctAnswer" placeholder="Correct Answer">

        <button onclick="addQuestion()">Add Question</button>

    </div>

    <!-- Quiz Section -->
    <div class="card hidden" id="quizSection">
        <h2 id="quizTitle"></h2>

        <form id="quizForm"></form>

        <button onclick="submitQuiz()">Submit Quiz</button>
    </div>

    <!-- Result Section -->
    <div class="card hidden" id="resultSection">
        <h2>Quiz Result</h2>
        <div class="score-box" id="scoreBox"></div>
    </div>

</div>

<script>

// Admin Credentials
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "admin123";

// Quiz Questions with Daily Admin Update Support
let quizData = JSON.parse(localStorage.getItem("quizData")) || {

    c:[
        {
            question:"1. Who developed C language?",
            options:["Dennis Ritchie","James Gosling","Guido Van Rossum","Bjarne Stroustrup"],
            answer:"Dennis Ritchie"
        },
        {
            question:"2. Which symbol is used for comments in C?",
            options:["//","<!-- -->","##","**"],
            answer:"//"
        },
        {
            question:"3. Which header file is used for printf()?",
            options:["stdio.h","math.h","string.h","conio.h"],
            answer:"stdio.h"
        },
        {
            question:"4. Which loop executes at least once?",
            options:["for","while","do while","none"],
            answer:"do while"
        },
        {
            question:"5. Which keyword is used to stop loop?",
            options:["exit","stop","break","return"],
            answer:"break"
        }
    ],

    java:[
        {
            question:"1. Java was developed by?",
            options:["James Gosling","Dennis Ritchie","Bill Gates","Elon Musk"],
            answer:"James Gosling"
        },
        {
            question:"2. Java is a ____ language.",
            options:["Compiled","Interpreted","Both","None"],
            answer:"Both"
        },
        {
            question:"3. Which keyword is used for inheritance?",
            options:["implement","extends","inherit","using"],
            answer:"extends"
        },
        {
            question:"4. JVM stands for?",
            options:["Java Variable Machine","Java Virtual Machine","Joint Virtual Machine","None"],
            answer:"Java Virtual Machine"
        },
        {
            question:"5. Which method starts Java program?",
            options:["run()","main()","start()","init()"],
            answer:"main()"
        }
    ],

    dbms:[
        {
            question:"1. DBMS stands for?",
            options:["Database Management System","Data Backup Management System","Database Method System","None"],
            answer:"Database Management System"
        },
        {
            question:"2. Which language is used in DBMS?",
            options:["SQL","HTML","CSS","Python"],
            answer:"SQL"
        },
        {
            question:"3. Primary key cannot contain?",
            options:["Numbers","Duplicates","Unique Values","Characters"],
            answer:"Duplicates"
        },
        {
            question:"4. SQL stands for?",
            options:["Structured Query Language","Simple Query Language","Sequential Query Language","None"],
            answer:"Structured Query Language"
        },
        {
            question:"5. Which command is used to retrieve data?",
            options:["GET","SELECT","OPEN","SHOW"],
            answer:"SELECT"
        }
    ]
};

let selectedSubject = "";

// Student Registration & Start Quiz
function startQuiz(){

    const name = document.getElementById("studentName").value;
    const email = document.getElementById("studentEmail").value;
    selectedSubject = document.getElementById("subjectSelect").value;

    if(name === "" || email === "" || selectedSubject === ""){
        alert("Please fill all details");
        return;
    }

    document.getElementById("registerSection").classList.add("hidden");
    document.getElementById("adminLoginSection").classList.add("hidden");

    loadQuiz();
}

// Load Quiz Questions
function loadQuiz(){

    document.getElementById("quizSection").classList.remove("hidden");

    const form = document.getElementById("quizForm");
    form.innerHTML = "";

    document.getElementById("quizTitle").innerText = selectedSubject.toUpperCase() + " Subject Quiz";

    quizData[selectedSubject].forEach((q,index)=>{

        const div = document.createElement("div");
        div.classList.add("question");

        let html = `<p>${q.question}</p>`;

        q.options.forEach(option=>{
            html += `
                <div class="option">
                    <label>
                        <input type="radio" name="q${index}" value="${option}">
                        ${option}
                    </label>
                </div>
            `;
        });

        div.innerHTML = html;
        form.appendChild(div);
    });
}

// Submit Quiz
function submitQuiz(){

    let score = 0;

    quizData[selectedSubject].forEach((q,index)=>{

        const selected = document.querySelector(`input[name="q${index}"]:checked`);

        if(selected && selected.value === q.answer){
            score++;
        }
    });

    document.getElementById("quizSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");

    document.getElementById("scoreBox").innerHTML = `Your Score: ${score} / ${quizData[selectedSubject].length}`;
}

// Admin Login
function adminLogin(){

    const user = document.getElementById("adminUser").value;
    const pass = document.getElementById("adminPass").value;

    if(user === ADMIN_USERNAME && pass === ADMIN_PASSWORD){

        document.getElementById("adminPanel").classList.remove("hidden");
        alert("Admin Login Successful");

    }else{
        alert("Invalid Admin Credentials");
    }
}

// Logout Admin
function logoutAdmin(){

    document.getElementById("adminPanel").classList.add("hidden");

    document.getElementById("adminUser").value = "";
    document.getElementById("adminPass").value = "";

    alert("Admin Logged Out");
}

// Add Questions by Admin
function addQuestion(){

    const subject = document.getElementById("adminSubject").value;
    const question = document.getElementById("questionInput").value;
    const option1 = document.getElementById("option1").value;
    const option2 = document.getElementById("option2").value;
    const option3 = document.getElementById("option3").value;
    const option4 = document.getElementById("option4").value;
    const correctAnswer = document.getElementById("correctAnswer").value;

    if(question === "" || option1 === "" || option2 === "" || option3 === "" || option4 === "" || correctAnswer === ""){
        alert("Fill all question fields");
        return;
    }

    const newQuestion = {
        question:question,
        options:[option1,option2,option3,option4],
        answer:correctAnswer
    };

    quizData[subject].push(newQuestion);

    // Save Questions Permanently
    localStorage.setItem("quizData", JSON.stringify(quizData));

    alert("Question Added Successfully and Saved");

    document.getElementById("questionInput").value = "";
    document.getElementById("option1").value = "";
    document.getElementById("option2").value = "";
    document.getElementById("option3").value = "";
    document.getElementById("option4").value = "";
    document.getElementById("correctAnswer").value = "";
}

// Delete Question
function deleteQuestion(subject,index){

    quizData[subject].splice(index,1);

    localStorage.setItem("quizData", JSON.stringify(quizData));

    alert("Question Deleted Successfully");
}

// Edit Question
function editQuestion(subject,index,newQuestion){

    quizData[subject][index] = newQuestion;

    localStorage.setItem("quizData", JSON.stringify(quizData));

    alert("Question Updated Successfully");
}

</script>

</body>
</html>
