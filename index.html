<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Application</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#000428,#004e92);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(0,183,255,0.2);
    animation:float 10s infinite linear;
}

.circle:nth-child(1){
    width:250px;
    height:250px;
    top:10%;
    left:5%;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:10%;
    right:10%;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    top:60%;
    left:40%;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-30px);
    }
    100%{
        transform:translateY(0px);
    }
}

.container{
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#00d9ff;
}

.question{
    font-size:20px;
    margin-bottom:20px;
}

.option{
    background:#111;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    border:1px solid transparent;
}

.option:hover{
    background:#00b7ff;
    transform:scale(1.03);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#00b7ff;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

button:hover{
    background:#0095d9;
}

.result{
    text-align:center;
    margin-top:20px;
    font-size:22px;
    color:#00ffae;
}

.level{
    text-align:center;
    margin-bottom:15px;
    color:#ffd700;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="container">

    <h1>AI Quiz Application</h1>

    <div class="level" id="level">
        Difficulty Level : Easy
    </div>

    <div class="question" id="question">
        Question appears here
    </div>

    <div id="options"></div>

    <button onclick="nextQuestion()">Next Question</button>

    <div class="result" id="result"></div>

</div>

<script>

const quizData = [

{
    question:"What does HTML stand for?",
    options:[
        "Hyper Text Markup Language",
        "High Text Machine Language",
        "Hyperlinks Text Mark",
        "Home Tool Markup"
    ],
    answer:"Hyper Text Markup Language",
    difficulty:"Easy"
},

{
    question:"Which language is used for Machine Learning?",
    options:[
        "Python",
        "HTML",
        "CSS",
        "PHP"
    ],
    answer:"Python",
    difficulty:"Medium"
},

{
    question:"Which algorithm is used for prediction?",
    options:[
        "Linear Regression",
        "HTML",
        "Bootstrap",
        "DNS"
    ],
    answer:"Linear Regression",
    difficulty:"Hard"
}

];

let currentQuestion = 0;
let score = 0;

function loadQuestion(){

    const questionData = quizData[currentQuestion];

    document.getElementById("question").innerText =
        questionData.question;

    document.getElementById("level").innerText =
        "Difficulty Level : " + questionData.difficulty;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    questionData.options.forEach(option => {

        const div = document.createElement("div");

        div.classList.add("option");

        div.innerText = option;

        div.onclick = () => selectAnswer(option);

        optionsContainer.appendChild(div);

    });

}

function selectAnswer(selected){

    const correct =
        quizData[currentQuestion].answer;

    if(selected === correct){

        score++;

        alert("Correct Answer ✅");

    }else{

        alert("Wrong Answer ❌");

    }

}

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < quizData.length){

        loadQuestion();

    }else{

        document.querySelector(".container").innerHTML =
        `
        <h1>Quiz Completed</h1>
        <div class="result">
            Your Score : ${score}/${quizData.length}
        </div>
        <br>
        <button onclick="location.reload()">
            Restart Quiz
        </button>
        `;

    }

}

/* Basic ML Logic */

function adaptiveDifficulty(){

    if(score <= 1){

        return "Easy";

    }else if(score == 2){

        return "Medium";

    }else{

        return "Hard";

    }

}

loadQuestion();

</script>

</body>
</html>
