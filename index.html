# Online Quiz Application for Engineering Students

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Quiz Portal</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#000000,#001f3f,#003366,#000814);
      color:white;
      min-height:100vh;
    }

    header{
      background:rgba(0,0,0,0.8);
      padding:20px;
      text-align:center;
      box-shadow:0 0 15px #00aaff;
    }

    header h1{
      color:#00bfff;
      font-size:36px;
    }

    .container{
      width:90%;
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid #00bfff;
      padding:25px;
      margin-top:20px;
      border-radius:15px;
      box-shadow:0 0 20px rgba(0,191,255,0.3);
    }

    h2{
      color:#00bfff;
      margin-bottom:15px;
    }

    input, select, textarea{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:none;
      border-radius:8px;
      background:#0f172a;
      color:white;
      border:1px solid #00bfff;
    }

    button{
      background:#00bfff;
      color:black;
      padding:12px 20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
      transition:0.3s;
    }

    button:hover{
      background:#0099cc;
      color:white;
    }

    .question-box{
      margin-top:20px;
      padding:15px;
      background:#08111f;
      border-radius:10px;
      border-left:5px solid #00bfff;
    }

    .question-box p{
      font-size:18px;
      margin-bottom:10px;
    }

    .option{
      margin:8px 0;
    }

    .hidden{
      display:none;
    }

    .score{
      font-size:24px;
      color:#00ffcc;
      text-align:center;
      margin-top:20px;
    }

    footer{
      text-align:center;
      padding:20px;
      margin-top:40px;
      background:black;
      color:#00bfff;
    }
  </style>
</head>
<body>

<header>
  <h1>Engineering Online Quiz Application</h1>
  <p>Subject Wise Quiz Portal for Engineering Students</p>
</header>

<div class="container">

  <!-- Student Registration -->
  <div class="card">
    <h2>Student Registration</h2>
    <input type="text" id="studentName" placeholder="Enter Student Name">
    <input type="email" id="studentEmail" placeholder="Enter Email">
    <button onclick="registerStudent()">Register</button>
    <p id="registerMsg"></p>
  </div>

  <!-- Subject Selection -->
  <div class="card hidden" id="subjectSection">
    <h2>Select Subject</h2>
    <select id="subjectSelect">
      <option value="">-- Select Subject --</option>
      <option value="C Programming">C Programming</option>
      <option value="Java">Java</option>
      <option value="Python">Python</option>
      <option value="Database Management">Database Management</option>
    </select>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- Quiz Section -->
  <div class="card hidden" id="quizSection">
    <h2 id="quizTitle"></h2>
    <div id="questionsContainer"></div>
    <button onclick="submitQuiz()">Submit Quiz</button>
    <div class="score" id="score"></div>
  </div>

  <!-- Admin Panel -->
  <div class="card">
    <h2>Admin Panel - Add Questions</h2>

    <select id="adminSubject">
      <option value="C Programming">C Programming</option>
      <option value="Java">Java</option>
      <option value="Python">Python</option>
      <option value="Database Management">Database Management</option>
    </select>

    <textarea id="questionText" placeholder="Enter Question"></textarea>
    <input type="text" id="option1" placeholder="Option 1">
    <input type="text" id="option2" placeholder="Option 2">
    <input type="text" id="option3" placeholder="Option 3">
    <input type="text" id="option4" placeholder="Option 4">
    <input type="text" id="correctAnswer" placeholder="Correct Answer">

    <button onclick="addQuestion()">Add Question</button>
    <p id="adminMsg"></p>
  </div>

</div>

<footer>
  © 2026 Engineering Quiz Portal | Blue & Black Theme Design
</footer>

<script>

  let students = [];

  let quizData = {
    "C Programming": [],
    "Java": [],
    "Python": [],
    "Database Management": []
  };

  // Default Questions
  for(let i=1;i<=10;i++){
    quizData["C Programming"].push({
      question:`C Question ${i}`,
      options:["Option A","Option B","Option C","Option D"],
      answer:"Option A"
    });

    quizData["Java"].push({
      question:`Java Question ${i}`,
      options:["Option A","Option B","Option C","Option D"],
      answer:"Option B"
    });

    quizData["Python"].push({
      question:`Python Question ${i}`,
      options:["Option A","Option B","Option C","Option D"],
      answer:"Option C"
    });

    quizData["Database Management"].push({
      question:`DBMS Question ${i}`,
      options:["Option A","Option B","Option C","Option D"],
      answer:"Option D"
    });
  }

  function registerStudent(){
    let name = document.getElementById("studentName").value;
    let email = document.getElementById("studentEmail").value;

    if(name === "" || email === ""){
      alert("Please fill all fields");
      return;
    }

    students.push({name,email});

    document.getElementById("registerMsg").innerHTML =
      "Registration Successful";

    document.getElementById("subjectSection").classList.remove("hidden");
  }

  function startQuiz(){
    let subject = document.getElementById("subjectSelect").value;

    if(subject === ""){
      alert("Please select subject");
      return;
    }

    document.getElementById("quizSection").classList.remove("hidden");
    document.getElementById("quizTitle").innerText = subject + " Quiz";

    let container = document.getElementById("questionsContainer");
    container.innerHTML = "";

    let questions = quizData[subject];

    questions.forEach((q,index)=>{
      let div = document.createElement("div");
      div.classList.add("question-box");

      let html = `<p>${index+1}. ${q.question}</p>`;

      q.options.forEach(option=>{
        html += `
          <div class="option">
            <input type="radio" name="q${index}" value="${option}"> ${option}
          </div>
        `;
      });

      div.innerHTML = html;
      container.appendChild(div);
    });
  }

  function submitQuiz(){
    let subject = document.getElementById("subjectSelect").value;
    let questions = quizData[subject];

    let score = 0;

    questions.forEach((q,index)=>{
      let selected = document.querySelector(`input[name="q${index}"]:checked`);

      if(selected && selected.value === q.answer){
        score++;
      }
    });

    document.getElementById("score").innerHTML =
      `Your Score: ${score} / ${questions.length}`;
  }

  function addQuestion(){
    let subject = document.getElementById("adminSubject").value;
    let question = document.getElementById("questionText").value;
    let option1 = document.getElementById("option1").value;
    let option2 = document.getElementById("option2").value;
    let option3 = document.getElementById("option3").value;
    let option4 = document.getElementById("option4").value;
    let answer = document.getElementById("correctAnswer").value;

    if(question === ""){
      alert("Please enter question");
      return;
    }

    quizData[subject].push({
      question:question,
      options:[option1,option2,option3,option4],
      answer:answer
    });

    document.getElementById("adminMsg").innerHTML =
      "Question Added Successfully";

    document.getElementById("questionText").value = "";
    document.getElementById("option1").value = "";
    document.getElementById("option2").value = "";
    document.getElementById("option3").value = "";
    document.getElementById("option4").value = "";
    document.getElementById("correctAnswer").value = "";
  }

</script>

</body>
</html>
